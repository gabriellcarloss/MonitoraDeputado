[project]
name = "monitora"
version = "0.1.0"
description = "Pipeline de dados do MonitoraDeputado"
requires-python = ">=3.12"
dependencies = ["duckdb>=1.1", "httpx>=0.27", "pydantic>=2.8", "python-dateutil>=2.9"]

[project.scripts]
monitora = "monitora.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monitora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
