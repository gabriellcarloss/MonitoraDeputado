name: Atualizar dados e publicar

on:
  schedule:
    - cron: "0 7 * * *" # 04:00 em Brasília
  workflow_dispatch:
    inputs:
      ficticio:
        description: "Publicar dados FICTÍCIOS (só para testar a publicação)"
        type: boolean
        default: false
      inspecao:
        description: "Gravar fotos das páginas e resumo dos dados no ramo 'inspecao' (para conferência)"
        type: boolean
        default: false
      so_previa:
        description: "Só prévia: NÃO publicar na Vercel (use junto com as fotos)"
        type: boolean
        default: false

concurrency:
  group: data-and-deploy
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Cache das fontes (downloads, respostas da API e CNPJs)
        uses: actions/cache@v4
        with:
          path: pipeline/.cache
          key: fontes-${{ github.run_id }}
          restore-keys: fontes-

      - name: Meta da versão publicada (para validar variações)
        if: ${{ env.SITE_URL != '' }}
        run: |
          mkdir -p web/public/data
          curl -fsSL "$SITE_URL/data/meta.json" -o web/public/data/meta.json || echo "sem versão anterior"

      - name: Pipeline de dados
        if: ${{ !inputs.ficticio }}
        run: make data

      - name: Dados fictícios
        if: ${{ inputs.ficticio }}
        working-directory: web
        run: pnpm fixtures

      - name: Build do site
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Inspeção (fotos e resumo no ramo 'inspecao')
        if: ${{ inputs.inspecao }}
        working-directory: web
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/inspecao.mjs ../inspecao-saida
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # grava num worktree separado para não mexer na pasta do build (a publicação vem depois)
          git worktree add --orphan -b inspecao /tmp/inspecao
          cp -r inspecao-saida/. /tmp/inspecao/
          cd /tmp/inspecao
          git add -A
          git commit -m "inspeção $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin inspecao

      - name: Publicar na Vercel
        if: ${{ !inputs.so_previa }}
        working-directory: web
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # dados fictícios nunca vão para produção: só pré-visualização
          ALVO: ${{ inputs.ficticio && '--target=preview' || '--prod' }}
        run: |
          # até 3 tentativas; o motivo da falha vai para o resumo da execução
          for tentativa in 1 2 3; do
            if npx --yes vercel@62.0.0 deploy out $ALVO --yes --token "$VERCEL_TOKEN" > deploy.log 2>&1; then
              cat deploy.log
              exit 0
            fi
            echo "tentativa $tentativa falhou"
            tail -20 deploy.log
            sleep $((tentativa * 30))
          done
          {
            echo "### Falha ao publicar na Vercel"
            echo '```'
            tail -30 deploy.log | grep -v -i token
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Publicar na Vercel::$(grep -i -m1 'error' deploy.log | cut -c1-300)"
          exit 1
